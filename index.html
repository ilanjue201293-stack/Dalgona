<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#8f7048" />
  <title>Dalgona — Ink Game Practice</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main id="app">
    <section id="game" aria-label="Dalgona game">
      <div id="camera">
        <canvas id="cookieCanvas"></canvas>
        <canvas id="traceCanvas"></canvas>
        <canvas id="crackCanvas"></canvas>
      </div>
      <div id="needle" aria-hidden="true"><span class="eye"></span><span class="shaft"></span><span class="tip"></span></div>
      <div id="screenTint"></div>

      <div id="hud">
        <div id="timer">2:00</div>
        <div id="cookieName">TRIANGLE</div>

        <div id="fearHud">
          <div class="fearHeader"><span>FEAR</span><span id="fearPct">0%</span></div>
          <div class="fearTrack"><div id="fearFill"></div></div>
        </div>

        <div id="crackPips" aria-label="Cookie cracks"></div>

        <div id="progressHud">
          <div class="progressIcon"><span></span></div>
          <div class="progressTrack"><div id="progressFill"></div></div>
          <div id="progressPct">0%</div>
        </div>

        <button id="breatheBtn" type="button">HOLD <b>SPACE</b> · BREATHE</button>
        <div id="qte" aria-hidden="true">
          <div class="qteTarget"></div>
          <div class="qteRing"></div>
          <strong id="qteKey">Q</strong>
        </div>
        <div id="toast"></div>
      </div>

      <div id="startScreen" class="overlay show">
        <div class="panel">
          <div class="kicker">INK GAME · DALGONA REWORK PRACTICE</div>
          <h1>DALGONA</h1>
          <p>Hold click and trace the stamped groove with the needle. The needle tip is the exact hit point.</p>
          <div class="settings">
            <label>COOKIE
              <select id="cookieSelect">
                <option value="random">Random (18)</option>
                <option>Triangle</option><option>Circle</option><option>Star</option><option>Umbrella</option>
                <option>Sackboy</option><option>Mona Lisa</option><option>Pig</option><option>Adjute</option>
                <option>Blahaj</option><option>Fusion</option><option>Peabert</option><option>Rogue Lineage</option>
                <option>Troll Face</option><option>Silly & Locked-In</option><option>67</option>
                <option>I GOT A SQUID</option><option>Squid</option><option>Mona Lisa Figure</option>
              </select>
            </label>
            <label class="check"><input id="hardcore" type="checkbox" /> HARDCORE</label>
            <label class="check"><input id="nearby" type="checkbox" checked /> NEARBY ELIMINATIONS</label>
          </div>
          <button id="playBtn" class="primary" type="button">PLAY</button>
        </div>
      </div>

      <div id="revealScreen" class="overlay">
        <div class="tin" id="tin">
          <div class="tinBack"></div><div class="tinCookie"></div><div class="tinLid"></div>
          <div id="revealName">TRIANGLE</div>
        </div>
      </div>

      <div id="endScreen" class="overlay">
        <div class="panel resultPanel">
          <div id="resultKicker" class="kicker">ROUND COMPLETE</div>
          <h2 id="resultTitle">SUCCESS</h2>
          <p id="resultMessage"></p>
          <div class="stats">
            <div><b id="statTime">0:00</b><span>TIME</span></div>
            <div><b id="statCracks">0/5</b><span>CRACKS</span></div>
            <div><b id="statFear">0%</b><span>MAX FEAR</span></div>
          </div>
          <button id="againBtn" class="primary" type="button">PLAY AGAIN</button>
          <button id="menuBtn" class="secondary" type="button">MENU</button>
        </div>
      </div>
      <div id="flash"></div>
    </section>
  </main>
  <script src="/script.js"></script>
</body>
</html>
